name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Keep this in sync with `rust-version` in Cargo.toml. 1.96 is required by the
  # gstreamer 0.25 bindings (MSRV 1.92) and the pinned toolchain for this release.
  MSRV: "1.96.0"

jobs:
  # Formatting and lint gates — fast, run first.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build + test across the feature matrix so the compression tests actually run.
  test:
    name: test (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: "default", flags: "" }
          - { name: "compression-zstd", flags: "--features compression-zstd" }
          - { name: "compression-lz4", flags: "--features compression-lz4" }
          - { name: "compression-gzip", flags: "--features compression-gzip" }
          - { name: "compression", flags: "--features compression" }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      - name: Build
        run: cargo build --verbose ${{ matrix.features.flags }}
      - name: Test
        run: cargo test --verbose ${{ matrix.features.flags }}

  # A release-mode test run catches optimization-only issues.
  test-release:
    name: test (release, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release)
        run: cargo test --release --features compression

  # Verify the crate still builds on its declared minimum supported Rust version.
  msrv:
    # NOTE: a job `name` can't use the `env` context (only github/needs/strategy/
    # matrix/vars/inputs) — using ${{ env.MSRV }} here is a startup_failure. Keep
    # this literal in sync with the MSRV env var above and Cargo.toml.
    name: MSRV (1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build on MSRV (all features)
        run: cargo +${{ env.MSRV }} build --all-features --verbose

  # Dependency hygiene: licenses, advisories, and a vulnerability audit.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check for unused dependencies
        run: cargo machete
