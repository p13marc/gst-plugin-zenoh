# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# Use the default advisory database; fail the build on any unmaintained or
# vulnerable dependency. `ignore` can hold specific RUSTSEC ids when a fix is
# pending and the risk has been reviewed.
yanked = "deny"
# TODO(2026-08-29): re-reviewed on the zenoh 1.10 bump. RUSTSEC-2026-0009
# (time stack exhaustion) was dropped — fixed by cargo update -p time. The
# four below still have no upstream fix reachable from the zenoh 1.10 tree.
ignore = [
    "RUSTSEC-2026-0041", # lz4_flex decompress leak; zenoh pins ^0.10, fix is 0.11.6+
    "RUSTSEC-2024-0436", # paste unmaintained (proc-macro, build-time only)
    "RUSTSEC-2023-0071", # rsa Marvin timing sidechannel (via zenoh auth); no fix upstream
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (via zenoh tls)
]

[licenses]
# This crate is MPL-2.0; accept dependencies under well-known permissive or
# weak-copyleft licenses compatible with redistribution. EPL-2.0 is required:
# Eclipse Zenoh (the whole point of this plugin) and its crates are EPL-2.0.
allow = [
    "MPL-2.0",
    "EPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# r-efi is LGPL-2.1, but it is a UEFI-only transitive dependency that is never
# compiled or linked on the Linux targets this plugin ships for.
exceptions = [
    { name = "r-efi", allow = ["LGPL-2.1-or-later"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
